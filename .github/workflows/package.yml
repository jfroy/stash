name: package

on:
  push:
    tags:
      - v*-cudajellyfin*

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.actor }}/stash

jobs:
  build:
    outputs:
      digest_amd64: ${{ steps.digest.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.digest.outputs.digest_arm64 }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - id: buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          build-args: |
            GITHASH=${{ github.sha }}
            STASH_VERSION=${{ github.ref_name }}
          builder: ${{ steps.buildx.outputs.name }}
          file: ./docker/Dockerfile-CUDAJELLY
          platforms: linux/${{ matrix.arch }}
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}

      - id: digest
        run: echo "digest_${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

  merge-and-attest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.actor }}/stash:${{ github.ref_name }} \
            ${{ env.IMAGE }}@${{ needs.build.outputs.digest_amd64 }} \
            ${{ env.IMAGE }}@${{ needs.build.outputs.digest_arm64 }}

      - id: digest
        run: |
          DIGEST=$(curl -sI \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            https://ghcr.io/v2/${{ github.actor }}/stash/manifests/${{ github.ref_name }} \
            | grep -i Docker-Content-Digest \
            | awk '{print $2}' \
            | tr -d '\r')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - uses: actions/attest-build-provenance@v2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.digest.outputs.digest }}
          subject-name: ${{ env.IMAGE }}
