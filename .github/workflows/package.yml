name: package

on:
  push:
    tags:
      - v*-cudajellyfin*

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.actor }}/stash

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - id: buildx
        uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          build-args: |
            GITHASH=${{ github.sha }}
            STASH_VERSION=${{ github.ref_name }}
          builder: ${{ steps.buildx.outputs.name }}
          file: ./docker/Dockerfile-CUDAJELLY
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
      - run: echo "DIGEST_${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> $GITHUB_ENV

  merge-and-attest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.actor }}/stash:${{ github.ref_name }} \
            ${{ env.IMAGE }}@${{ env.DIGEST_amd64 }} \
            ${{ env.IMAGE }}@${{ env.DIGEST_arm64 }}
      - id: digest
        run: |
          DIGEST=$(curl -sI \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            https://ghcr.io/v2/${{ github.repository }}/manifests/latest \
            | grep -i Docker-Content-Digest \
            | awk '{print $2}' \
            | tr -d '\r')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
